parameters:
- name: yocto_release
  displayName: "Yocto Release version"
  type: string
  default: "scarthgap"
- name: adu_generation
  displayName: "ADU Generation"
  type: string
  default: "1"
- name: adu_use_test_root_keys
  displayName: "Use Test Root Keys for ADU"
  type: boolean
  default: false
- name: adu_src_uri
  displayName: "ADU Source URI"
  type: string
  default: "git://github.com/Azure/iot-hub-device-update"
- name: adu_git_branch
  displayName: "ADU Git Branch"
  type: string
  default: "develop"
- name: adu_git_commit
  displayName: "ADU Git Commit"
  type: string
  default: "AUTOREV"
- name: do_src_uri
  displayName: "DO Source URI"
  type: string
  default: "git://github.com/microsoft/do-client"
- name: do_git_branch
  displayName: "DO Git Branch"
  type: string
  default: "develop"
- name: do_git_commit
  displayName: "DO Git Commit"
  type: string
  default: "AUTOREV"
- name: adu_delta_src_uri
  displayName: "ADU Delta Source URI"
  type: string
  default: "git://github.com/azure/io-thub-device-update-delta"
- name: adu_delta_git_branch
  displayName: "ADU Delta Git Branch"
  type: string
  default: "main"
- name: adu_delta_git_commit
  displayName: "ADU Delta Git Commit"
  type: string
  default: "AUTOREV"
- name: build_workspace_dir
  displayName: "Directory for the build workspace"
  type: string
  default: "$(Pipeline.Workspace)/build/"
- name: adu_key_dir
  displayName: "Directory for the ADU keys"
  type: string

steps: 
  - task: Bash@3
    displayName: "Download ADU Keys"
    inputs:
      workingDirectory: "$(Build.SourcesDirectory)"
      targetType: inline
      script: |
        echo "Downloading test keys to $(Build.SourcesDirectory)/keys"
        az login --identity
        az storage blob download --auth-mode login --account-name aduetestsetupstorage --container-name yocto-test-images --name yocto_keys.tar.gz --file /tmp/yocto_keys.tar.gz
        mkdir -p $(Build.SourcesDirectory)/keys
        tar -xf /tmp/yocto_keys.tar.gz -C $(Build.SourcesDirectory)/keys
        echo "Download completed"
        ls -l $(Build.SourcesDirectory)/keys

      failOnStandardError: true
    name: DownloadADUKey
  - bash: |
      echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
      ./scripts/install-deps.sh
    displayName: Install dependencies for Yocto Build
    workingDirectory: "$(Build.SourcesDirectory)"
    failOnStderr: true

  - bash: |
      echo Cloning poky, branch $(yocto_release)
      echo Cloning meta-raspberrypi, branch $(yocto_release)
      echo Cloning meta-azure-device-update, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release) git://git.yoctoproject.org/poky
    displayName: "Clone poky $(yocto_release)"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-swupdate, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  https://github.com/sbabic/meta-swupdate
      git -C meta-swupdate rev-parse --abbrev-ref HEAD
      git -C meta-swupdate rev-parse HEAD
    displayName: "Clone meta-swupdate"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-openembedded, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  git://git.openembedded.org/meta-openembedded
      git -C meta-openembedded rev-parse --abbrev-ref HEAD
      git -C meta-openembedded rev-parse HEAD
    displayName: "Clone meta-openembedded"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-raspberrypi, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  git://git.yoctoproject.org/meta-raspberrypi
      git -C meta-raspberrypi rev-parse --abbrev-ref HEAD
      git -C meta-raspberrypi rev-parse HEAD
    displayName: "Clone meta-raspberrypi"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-azure-device-update, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  https://github.com/azure/meta-azure-device-update
      git -C meta-azure-device-update rev-parse --abbrev-ref HEAD
      git -C meta-azure-device-update rev-parse HEAD
    displayName: "Clone meta-azure-device-update"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-azure-device-update-delta, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  https://github.com/azure/meta-iot-hub-device-update-delta
      git -C meta-iot-hub-device-update-delta rev-parse --abbrev-ref HEAD
      git -C meta-iot-hub-device-update-delta rev-parse HEAD
    displayName: "Clone meta-iot-hub-device-update-delta"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"

  - bash: |
      echo Cloning meta-raspberrypi-adu, branch $(yocto_release)
      git clone --depth 1 --branch $(yocto_release)  https://github.com/azure/meta-raspberrypi-adu
      git -C meta-raspberrypi-adu rev-parse --abbrev-ref HEAD
      git -C meta-raspberrypi-adu rev-parse HEAD
    displayName: "Clone meta-raspberrypi-adu"
    workingDirectory: "$(Build.SourcesDirectory)/yocto"
    
  - task: Bash@3
    displayName: "Yocto build - $(Build.BuildNumber), Gen $(adu_generation) | ADU $(adu_git_branch) : $(adu_git_commit) | DO $(do_git_branch) : $(do_git_commit) | ADU Delta $(adu_delta_git_branch) : $(adu_delta_git_commit)"
    inputs:
      targetType: "filePath"
      filePath: "./scripts/build.sh"
      arguments: '-c -t MinSizeRel -v $(Build.BuildNumber) --adu-generation $(adu_generation) --adu-use-test-root-keys $(adu_use_test_root_keys) --adu-src-uri $(adu_src_uri) --adu-git-branch $(adu_git_branch) --adu-git-commit $(adu_git_commit) --do-src-uri $(do_src_uri) --do-git-branch $(do_git_branch) --do-git-commit $(do_git_commit) --adu-delta-src-uri $(adu_delta_src_uri) --adu-delta-git-branch $(adu_delta_git_branch) --adu-delta-git-commit $(adu_delta_git_commit) --adu-key-dir $(Build.SourcesDirectory)/keys -o $(Build.BinariesDirectory)'
      workingDirectory: $(Build.SourcesDirectory)

  # Copy artifacts to a staging directory for publishing.
  # there's something you can do here to get the outputs to take care of it
  - bash: |
      mkdir -p $(Build.ArtifactStagingDirectory)/images
      cp $(Build.BinariesDirectory)/build/tmp/deploy/raspberrypi4-64/adu-base-image-raspberrypi4-64-*.wic.gz \
        $(Build.ArtifactStagingDirectory)/images/adu-base-image-raspberrypi4-64-$(Build.BuildNumber).wic.gz
      cp $(Build.BinariesDirectory)/build/tmp/deploy/images/raspberrypi4-64/adu-update-image-*.swu \
        $(Build.ArtifactStagingDirectory)/images/adu-update-image-raspberrypi4-64-$(Build.BuildNumber).swu
    workingDirectory: $(Build.ArtifactStagingDirectory)
    displayName: "Stage build artifacts"
    failOnStderr: true

