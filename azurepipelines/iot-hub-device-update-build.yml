resources:
  # Specify the pipelines that should cause this pipeline to be queued.
  pipelines:
    # Queue this pipeline whenever the ADU private-preview repo is changed.
    - pipeline: azure_adu_private_preview
      source: Azure.iot-hub-device-update
      trigger:
        branches:
          include:
            - develop

jobs:
- job: Build
  displayName: "Build Yocto Image"
  steps: 
    - bash: | 
        if [[ ! -d $(build_workspace_dir) ]]; then
          mkdir -p $(build_workspace_dir)
        fi
      displayName: "Ensuring build directory exists"

    - bash: |
        echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
        ./scripts/install-deps.sh
      displayName: Install dependencies for Yocto Build
      workingDirectory: "$(Build.SourcesDirectory)"
      failOnStderr: true

    - bash: |
        echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
        ./scripts/setup.sh
      displayName: Clone yocto and meta layers
      workingDirectory: "$(Build.SourcesDirectory)"
      failOnStderr: true
      
    - task: Bash@3
      displayName: "Run Yocto build"
      inputs:
        targetType: "filePath"
        filePath: "./scripts/build.sh"
        arguments: '-c -t MinSizeRel -v $(Build.BuildNumber) --adu-generation $(adu_generation) --adu-src-uri $(adu_src_uri) --adu-git-branch $(adu_git_branch) --adu-git-commit $(adu_git_commit) --do-src-uri $(do_src_uri) --do-git-branch $(do_git_branch) --do-git-commit $(do_git_commit) --adu-delta-src-uri $(adu_delta_src_uri) --adu-delta-git-branch $(adu_delta_git_branch) --adu-delta-git-commit $(adu_delta_git_commit) -o $(build_workspace_dir)'
        workingDirectory: $(Build.SourcesDirectory)

    # Copy artifacts to a staging directory for publishing.
    # there's something you can do here to get the outputs to take care of it
    - bash: |
        cp $(Build.BinariesDirectory)/build/tmp/deploy/images/raspberrypi4/adu-base-image-raspberrypi4.wic.gz \
          $(Build.ArtifactStagingDirectory)/adu-base-image-raspberrypi4-$(Build.BuildNumber).wic.gz
        cp $(Build.BinariesDirectory)/build/tmp/deploy/images/raspberrypi4/adu-update-image-raspberrypi4.swu \
          $(Build.ArtifactStagingDirectory)/adu-update-image-raspberrypi4-$(Build.BuildNumber).swu
      workingDirectory: $(Build.ArtifactStagingDirectory)
      displayName: "Stage build artifacts"
      failOnStderr: true

    - task: PublishBuildArtifacts@1
      displayName: "Publish images"
      inputs:
        ArtifactName: images
        PathtoPublish: "$(Build.ArtifactStagingDirectory)/images"

    - task: PublishBuildArtifacts@1
      displayName: "Publish binaries"
      inputs:
        ArtifactName: binaries
        PathtoPublish: "$(Build.ArtifactStagingDirectory)/bin"

