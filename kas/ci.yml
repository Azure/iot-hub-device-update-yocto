header:
  version: 14
  includes: []

# CI overlay: provides git URLs for all repos so kas can auto-clone on fresh VMs.
# Usage: kas build kas/machine-rpi4.yml:kas/ci.yml
#
# On developer machines, repos are pre-cloned under ../
# On CI, this overlay provides URLs so kas fetches them automatically.
# Branch selection is handled by the pipeline via a generated overlay;
# defaults here are used for standalone / local CI usage.

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"

  meta-clang:
    url: "https://github.com/kraj/meta-clang.git"

  meta-swupdate:
    url: "https://github.com/sbabic/meta-swupdate.git"

  # Board-specific BSP layers (meta-raspberrypi, meta-freescale) are
  # defined in each machine-*.yml file, not here. This avoids dynamic-layer
  # recipes from activating on the wrong machine.

  meta-azure-device-update:
    url: "https://github.com/Azure/meta-azure-device-update.git"

  meta-iot-hub-device-update-delta:
    url: "https://github.com/Azure/meta-iot-hub-device-update-delta.git"

  meta-azure-device-update-samples:
    url: "https://github.com/Azure/meta-azure-device-update-samples.git"

  meta-azure-device-update-bsp:
    url: "https://github.com/Azure/meta-azure-device-update-bsp.git"

local_conf_header:
  ci-override: |
    # CI: Use remote ADU source (not local file:// path)
    ADU_SRC_URI = "git://github.com/Azure/iot-hub-device-update"
    ADU_GIT_PROTOCOL = "https"
    ADU_GIT_COMMIT = "${AUTOREV}"
  ci-cache: |
    # CI: Use environment-provided cache dirs (set by pipeline)
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
  # IMPORTANT: kas emits local_conf_header blocks in alphabetical key order, so
  # base.yml's "samples" block runs BEFORE our "z-ci-delta-on" block and would
  # otherwise force WITH_FEATURE_DELTA_UPDATE=0 + BBMASK delta-generation. Use
  # a "z-" prefix so this block sorts LAST and our override wins.
  z-ci-delta-on: |
    # CI hosts always have the toolchain needed to build the delta handler
    # (libmicrosoft_delta_download_handler.so under /var/lib/adu/extensions/sources/).
    # Force delta ON unconditionally so verify-image-contents.sh's required-file
    # list is always satisfied, regardless of run_qemu_e2e/build_samples_package
    # pipeline params. Local developers using kas without ci.yml still get the
    # base.yml default (off) — they can opt-in via delta.yml / qemu-e2e.yml /
    # samples-package.yml as before.
    WITH_FEATURE_DELTA_UPDATE = "1"
    BBMASK:remove = " meta-azure-device-update-samples/recipes-samples/delta-generation"

    # libconfig K&R-vs-C23 fix (same as kas/qemu-e2e.yml and samples-package.yml).
    # GCC 15's default -std=gnu23 rejects libconfig 1.7.3's grammar.y K&R decls;
    # pin to gnu17 for that recipe only (target + native).
    CFLAGS:append:pn-libconfig-native = " -std=gnu17"
    CFLAGS:append:pn-libconfig = " -std=gnu17"
    BUILD_CFLAGS:append:pn-libconfig-native = " -std=gnu17"
