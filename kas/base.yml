header:
  version: 14
  includes: []

machine: qemuarm64

distro: poky

defaults:
  repos:
    branch: scarthgap

repos:
  poky:
    path: ../poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    path: ../meta-openembedded
    layers:
      meta-oe:
      meta-multimedia:
      meta-networking:
      meta-python:

  meta-clang:
    path: ../meta-clang

  meta-swupdate:
    path: ../meta-swupdate

  meta-azure-device-update:
    path: ../meta-azure-device-update

  meta-iot-hub-device-update-delta:
    path: ../meta-iot-hub-device-update-delta

  meta-azure-device-update-samples:
    path: ../meta-azure-device-update-samples

local_conf_header:
  base: |
    DISTRO_FEATURES:append = " systemd usrmerge"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
    PACKAGE_CLASSES ?= "package_ipk"
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
  samples: |
    # Disable delta updates by default (requires .NET SDK on build host)
    WITH_FEATURE_DELTA_UPDATE = "0"
    # Mask delta-only recipes that require .NET DiffGenTool
    BBMASK:append = " meta-azure-device-update-samples/recipes-samples/delta-generation"
    BBMASK:append = " meta-azure-device-update-samples/recipes-samples/adu-delta-test-package"
    # SWUpdate signing keys (generated test keys for dev builds)
    ADUC_PRIVATE_KEY = "${TOPDIR}/conf/swupdate-signing/priv.pem"
    ADUC_PRIVATE_KEY_PASSWORD = "${TOPDIR}/conf/swupdate-signing/priv.pass"
  adu-source: |
    # Use local clone of ADU agent source (avoids fetching from GitHub)
    ADU_SRC_URI = "git:///home/yocto/sources/iot-hub-device-update"
    ADU_GIT_PROTOCOL = "file"
    ADU_GIT_BRANCH = "feature/vnext-delta"
    ADU_GIT_COMMIT = "b82004ebe45cc7bd936c8f4301941efddc95f363"
  cache: |
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
  parallel: |
    BB_NUMBER_THREADS ?= "14"
    PARALLEL_MAKE ?= "-j 14"
