header:
  version: 14

# Add remote URLs for CI/fresh-clone builds
# Usage: kas build kas/base.yml:kas/machine-qemu.yml:kas/remote.yml
#
# For local development, omit this file — kas uses existing local clones.
# For CI pipelines, include this to enable automatic git clone/fetch.

defaults:
  repos:
    branch: scarthgap

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"

  meta-clang:
    url: "https://github.com/kraj/meta-clang.git"

  meta-swupdate:
    url: "https://github.com/sbabic/meta-swupdate.git"

  meta-iot-hub-device-update-delta:
    url: "https://github.com/Azure/iot-hub-device-update-delta.git"
    branch: feature/vnext-delta

  meta-azure-device-update:
    url: "https://github.com/Azure/meta-azure-device-update.git"
    branch: user/msft/nox-msft/new-yocto-poc

  # Board-specific BSP layers (meta-raspberrypi, meta-freescale) are
  # defined in each machine-*.yml file, not here.

  meta-azure-device-update-bsp:
    url: "https://github.com/Azure/meta-azure-device-update-bsp.git"
    branch: user/msft/nox-msft/new-yocto-poc
