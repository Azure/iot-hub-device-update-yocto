# kas-base.yml - Base configuration for Azure Device Update Yocto builds
#
# This is the foundation config. Combine with variant includes:
#   kas build kas/kas-base.yml:kas/kas-debug.yml
#   kas build kas/kas-base.yml:kas/kas-release.yml:kas/kas-delta.yml
#
header:
  version: 14
  includes:
    - kas-debug.yml

machine: raspberrypi4-64
distro: poky

defaults:
  repos:
    branch: scarthgap

repos:
  # This repo is not a layer — just hosts the kas configs and scripts
  iot-hub-device-update-yocto:
    layers:
      # Exclude from BBLAYERS (not a Yocto layer)
      '': disabled

  poky:
    url: https://git.yoctoproject.org/poky
    path: yocto/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    path: yocto/meta-openembedded
    layers:
      meta-oe:
      meta-multimedia:
      meta-networking:
      meta-python:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    path: yocto/meta-raspberrypi

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    path: yocto/meta-swupdate

  meta-clang:
    url: https://github.com/kraj/meta-clang
    path: yocto/meta-clang
    commit: 731488911f55ebfe746068512b426351192f82f2

  meta-azure-device-update:
    url: https://github.com/Azure/meta-azure-device-update
    path: yocto/meta-azure-device-update
    branch: feature/vnext-delta

  meta-iot-hub-device-update-delta:
    url: https://github.com/Azure/meta-iot-hub-device-update-delta
    path: yocto/meta-iot-hub-device-update-delta
    branch: feature/vnext-delta

  meta-azure-device-update-samples:
    url: https://github.com/Azure/meta-azure-device-update-samples
    path: yocto/meta-azure-device-update-samples
    branch: user/nox-msft/vnext-delta-kas-bld

  meta-raspberrypi-adu:
    url: https://github.com/Azure/meta-raspberrypi-adu
    path: yocto/meta-raspberrypi-adu
    branch: feature/vnext-delta

env:
  ADUC_PRIVATE_KEY: ""
  ADUC_PRIVATE_KEY_PASSWORD: ""
  WITH_FEATURE_DELTA_UPDATE: "0"
  ADU_GENERATION: "1"
  WITH_ADUC_TESTS: "1"
  BUILD_TYPE: Debug

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    EXTRA_IMAGE_FEATURES = "debug-tweaks tools-debug tools-sdk package-management"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    DISTRO_FEATURES:append = " systemd usrmerge"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
    PREFERRED_PROVIDER_virtual/adu-base-image = "adu-base-image"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    ADUC_PRIVATE_KEY = "${TOPDIR}/../keys/priv.pem"
    ADUC_PRIVATE_KEY_PASSWORD = "${TOPDIR}/../keys/priv.pass"
    BB_ENV_PASSTHROUGH_ADDITIONS += "ADU_GENERATION BUILD_TYPE WITH_FEATURE_DELTA_UPDATE WITH_ADUC_TESTS ENABLE_WIFI_BLUETOOTH"

target: adu-base-image
