header:
  version: 14
  includes:
    - base.yml

machine: qemuarm64
target:
  - adu-base-image
  - adu-update-image-v1
  - adu-update-image-v2
  - adu-update-image-v3

repos:
  meta-azure-device-update-bsp:
    path: ../meta-azure-device-update-bsp

local_conf_header:
  qemu: |
    # QEMU specific
    IMAGE_BOOT_FILES = "Image boot.scr"
    UBOOT_MACHINE = "qemu_arm64_defconfig"
