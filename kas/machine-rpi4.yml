header:
  version: 14
  includes:
    - base.yml

machine: raspberrypi4-64
target:
  - adu-base-image
  - adu-update-image-v1
  - adu-update-image-v2
  - adu-update-image-v3

repos:
  meta-raspberrypi:
    path: ../meta-raspberrypi
    url: "https://git.yoctoproject.org/meta-raspberrypi"

  meta-azure-device-update-bsp:
    path: ../meta-azure-device-update-bsp

local_conf_header:
  rpi: |
    # RPi4 specific
    ENABLE_UART = "1"
    RPI_USE_U_BOOT = "1"
    IMAGE_BOOT_FILES += "boot.scr"
