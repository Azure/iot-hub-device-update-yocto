header:
  version: 14
  includes:
    - base.yml

machine: raspberrypi4-64
target: adu-base-image

repos:
  meta-raspberrypi:
    path: ../meta-raspberrypi

  meta-raspberrypi-adu:
    path: ../meta-raspberrypi-adu

local_conf_header:
  rpi: |
    # RPi4 specific
    ENABLE_UART = "1"
    RPI_USE_U_BOOT = "1"
    IMAGE_BOOT_FILES += "boot.scr"
