header:
  version: 14
  includes:
    - base.yml

machine: raspberrypi4-64
target:
  - adu-base-image
  - adu-update-image-v1
  - adu-update-image-v2
  - adu-update-image-v3

repos:
  meta-raspberrypi:
    path: ../meta-raspberrypi
    url: "https://git.yoctoproject.org/meta-raspberrypi"

  meta-azure-device-update-bsp:
    path: ../meta-azure-device-update-bsp

local_conf_header:
  rpi: |
    # RPi4 specific
    ENABLE_UART = "1"
    RPI_USE_U_BOOT = "1"
    IMAGE_BOOT_FILES += "boot.scr"
    # meta-raspberrypi (scarthgap) pulls in linux-firmware-rpidistro-bcm43456
    # via packagegroup-base-extended for the BCM43456 Wi-Fi/BT chip on RPi4.
    # That firmware ships under the Synaptics SLA which Yocto gates behind
    # the 'synaptics-killswitch' LICENSE_FLAG. Accept it here so the image
    # builds; the flag only acknowledges the firmware redistribution terms.
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"
